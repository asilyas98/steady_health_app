workflows:
  steady-ios-appstore:
    name: Steady — iOS App Store IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - steady
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.simpleai.steady
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Install dependencies
        script: npm ci --no-audit --no-fund
      - name: Build web app and sync iOS project
        script: npm run sync:ios
      - name: Apply App Store signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
